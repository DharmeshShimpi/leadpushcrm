services:
  - type: web
    name: leadpush
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: APP_SECRET_PATH
        generateValue: true
    disk:
      name: leadpush-data
      mountPath: /app/data
      sizeGB: 1
